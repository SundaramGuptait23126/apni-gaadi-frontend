worker_processes auto;

events {
    worker_connections 65535; # Maximum TCP Limit
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream to API Gateway
    upstream api_gateway {
        server api-gateway:5000;
        keepalive 10000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Proxy Buffering to offload Node.js
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 16 32k;
            proxy_busy_buffers_size 64k;
        }

        # Fallback or Health check
        location / {
            return 200 'Apni Gaadi Dekho Edge Proxy Online';
            add_header Content-Type text/plain;
        }
    }
}
