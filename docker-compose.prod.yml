version: '3.8'

networks:
  apnigaadi_net:
    driver: bridge

services:
  redis:
    image: redis:alpine
    container_name: apni-gaadi-redis
    networks:
      - apnigaadi_net
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: apni-gaadi-nginx
    ports:
      - "80:80"
    networks:
      - apnigaadi_net
    depends_on:
      - api-gateway
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.core.somaxconn: 65535
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: apni-gaadi-api-gateway
    networks:
      - apnigaadi_net
    depends_on:
      - auth-service
      - car-service
      - compare-car-service
    env_file:
      - ./auth-service/.env
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.core.somaxconn: 65535
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: apni-gaadi-auth-service
    networks:
      - apnigaadi_net
    env_file:
      - ./auth-service/.env
    restart: unless-stopped

  car-service:
    build: ./car-service
    container_name: apni-gaadi-car-service
    networks:
      - apnigaadi_net
    env_file:
      - ./car-service/.env
    restart: unless-stopped

  compare-car-service:
    build: ./compare-car-service
    container_name: apni-gaadi-compare-car-service
    networks:
      - apnigaadi_net
    env_file:
      - ./compare-car-service/.env
    restart: unless-stopped
